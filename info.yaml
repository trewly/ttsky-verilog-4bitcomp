# Tiny Tapeout project information
project:
  title:        "A simple 4 bit cpu"      # Project title
  author:       "trewlyvuive"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "It is a very simple cpu with just 6 instruction and a very limited program stack and memory"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_trewlyvuive_4bitcomp"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_trewlyvuive_4bitcomp.v"
    - "alu.v"
    - "decoder.v"
    - "stack_mem.v"
    - "edge_detect.v"
    - "top_comp.v"
    - "control_unit.v"
    - "program_mem_main.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "program_in[0]"
  ui[1]: "program_in[1]"
  ui[2]: "program_in[2]"
  ui[3]: "program_in[3]"
  ui[4]: "program_in[4]"
  ui[5]: "program_in[5]"
  ui[6]: "program_in[6]"
  ui[7]: "program_in[7]"

  # Outputs
  uo[0]: "after_compute[0]"
  uo[1]: "after_compute[1]"
  uo[2]: "after_compute[2]"
  uo[3]: "after_compute[3]"
  uo[4]: "program_stack[0]"
  uo[5]: "program_stack[1]"
  uo[6]: "program_stack[2]"
  uo[7]: "program_stack[3]"

  # Bidirectional pins
  uio[0]: "read_result_button"
  uio[1]: "start_button"
  uio[2]: "program_mem_write_button"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
